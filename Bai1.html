<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>
    var txt = "<class><student><name>Nguyen Van A</name><age>20</age></student></class>";
    var parser = new DOMParser();
    var xmlDoc = parser.parseFromString(txt, "text/xml");
    var goc = xmlDoc.documentElement;

    document.getElementById("demo").innerHTML = 
        "Nút gốc: " + goc.nodeName + "<br>" +
        "Nút con đầu tiên: " + goc.firstChild.nodeName;
</script>

</body>
</html>
