<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>
    var txt = "<class><student><name>Nguyen Van A</name><age>20</age></student></class>";
    var parser = new DOMParser();
    var xmlDoc = parser.parseFromString(txt, "text/xml");
    
    var name = xmlDoc.getElementsByTagName("name")[0].textContent;
    var age = xmlDoc.getElementsByTagName("age")[0].textContent;
    
    document.getElementById("demo").innerHTML = "Họ tên: " + name + "<br>Tuổi: " + age;
</script>

</body>
</html>
